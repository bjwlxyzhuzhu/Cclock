appId: com.aichuangsai.cclock
productName: Cclock
copyright: Copyright © 2026 AI创赛贯通社

# macOS 的 ad-hoc 签名，见脚本里的说明；Windows 上不做事
afterPack: ./scripts/mac-adhoc-sign.js

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - dist/**/*
  - package.json
  - '!**/*.map'

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Cclock-${version}-setup.${ext}

# macOS：在 GitHub Actions 的 macOS 机器上构建（Windows 上做不了 dmg），见 .github/workflows/release.yml
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: Cclock-${version}-mac-${arch}.${ext}
  # 没有开发者证书：关掉 electron-builder 的签名，由 afterPack 钩子做 ad-hoc 签名
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    # 不进程序坞，只留菜单栏图标 —— 等同 Windows 的 skipTaskbar
    LSUIElement: true

dmg:
  title: Cclock ${version}

nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cclock
  deleteAppDataOnUninstall: false
